name: Daily Smartix Sales Data Pipeline

on:
  schedule:
    # 한국시간 매일 오전 08:00 실행 (UTC 기준 전일 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Create Google Key File
      run: |
        echo "${{ secrets.GCP_SA_KEY }}" > service_account.json

    - name: Run Main Script
      env:
        SMARTIX_ID: ${{ secrets.SMARTIX_ID }}
        SMARTIX_PW: ${{ secrets.SMARTIX_PW }}
        SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
      run: |
        python main.py
